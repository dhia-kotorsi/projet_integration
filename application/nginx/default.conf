server {
    listen 80;
    server_name app.project.test;

    root /var/www/html;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api.php {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_param SCRIPT_NAME /api.php;

        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location = /config.php {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
