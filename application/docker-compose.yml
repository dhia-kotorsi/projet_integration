name: mes-taches

services:

  nginx:
    image: nginx:stable-alpine
    container_name: mes-taches-nginx
    restart: unless-stopped

    ports:
      - "192.168.56.11:8080:80"

    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

    networks:
      - application_network

  php:
    build:
      context: .
      dockerfile: Dockerfile

    image: mes-taches-php:1.0
    container_name: mes-taches-php
    restart: unless-stopped

    environment:
      DB_HOST: "192.168.56.13"
      DB_PORT: "3306"
      DB_NAME: "taches_db"
      DB_USER: "app_user"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD doit etre defini}"

    volumes:
      - ./src:/var/www/html:ro

    networks:
      - application_network

networks:
  application_network:
    driver: bridge
